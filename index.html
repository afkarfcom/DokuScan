<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DocuScan Pro Mobile</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    }
  </script>
  <style>
    /* Prevent pull-to-refresh & rubber-banding on mobile */
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .canvas-container {
      touch-action: none;
      user-select: none;
    }
    /* Loupe Zoom */
    #magnifier {
      pointer-events: none;
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #10b981;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.8), 0 0 15px rgba(16,185,129,0.5);
      background-repeat: no-repeat;
      display: none;
      z-index: 50;
    }
    #magnifier::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 2px white;
    }
    /* Hide scrollbars for clean UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-[100dvh] w-screen overflow-hidden font-sans select-none">

  <!-- TOP MOBILE HEADER -->
  <header class="h-14 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-3 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-md shadow-brand-500/20">
        <i data-lucide="scan-line" class="w-4 h-4 text-white"></i>
      </div>
      <div class="flex items-center gap-1.5">
        <h1 class="font-bold text-sm leading-none">DocuScan</h1>
        <span id="pageBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-brand-500/20 text-brand-400 font-mono">0 Hal</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-1.5">
      <label for="imageUpload" class="cursor-pointer p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs font-medium rounded-lg flex items-center gap-1 border border-slate-700">
        <i data-lucide="plus" class="w-4 h-4 text-brand-400"></i>
        <span class="hidden sm:inline">Tambah</span>
      </label>
      <input type="file" id="imageUpload" accept="image/*" multiple class="hidden">

      <button id="btnExportPDF" disabled class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 disabled:opacity-40 disabled:hover:bg-brand-600 text-white text-xs font-medium rounded-lg flex items-center gap-1.5 shadow-md shadow-brand-600/20 active:scale-95 transition">
        <i data-lucide="file-down" class="w-4 h-4"></i>
        <span>PDF</span>
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex flex-col overflow-hidden relative">

    <!-- UPLOAD PLACEHOLDER -->
    <div id="dropZone" class="absolute inset-0 z-40 bg-slate-950 flex flex-col items-center justify-center p-4 text-center">
      <div class="max-w-sm w-full p-6 rounded-2xl border-2 border-dashed border-slate-800 bg-slate-900/50 flex flex-col items-center active:scale-98 transition" onclick="document.getElementById('imageUpload').click()">
        <div class="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center mb-3 text-brand-400">
          <i data-lucide="upload-cloud" class="w-8 h-8"></i>
        </div>
        <h2 class="text-base font-semibold text-slate-200 mb-1">Unggah Dokumen</h2>
        <p class="text-xs text-slate-400 mb-5">Pilih 1 atau beberapa foto dokumen</p>
        <button class="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-xl shadow flex items-center justify-center gap-2">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>Buka Galeri / Kamera</span>
        </button>
      </div>
    </div>

    <!-- CENTER: CANVAS VIEWPORT (AUTO-FIT) -->
    <main class="flex-1 w-full relative flex items-center justify-center p-2 overflow-hidden bg-slate-950">
      <div id="magnifier"></div>

      <!-- Crop Canvas Stage -->
      <div id="cropStage" class="relative w-full h-full flex items-center justify-center hidden">
        <div class="relative max-w-full max-h-full canvas-container flex items-center justify-center">
          <canvas id="cropCanvas" class="max-w-full max-h-[calc(100dvh-230px)] object-contain block rounded shadow-lg border border-slate-800"></canvas>
        </div>
      </div>

      <!-- Result Preview Stage -->
      <div id="previewStage" class="relative w-full h-full flex items-center justify-center hidden">
        <div class="relative max-w-full max-h-full flex items-center justify-center">
          <canvas id="resultCanvas" class="max-w-full max-h-[calc(100dvh-230px)] object-contain block rounded shadow-lg border border-slate-800 bg-white"></canvas>
        </div>
      </div>
    </main>

    <!-- HORIZONTAL THUMBNAIL BAR -->
    <section id="thumbSection" class="h-16 bg-slate-900/95 border-t border-slate-800 px-3 py-1.5 flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0 hidden z-20">
      <div id="thumbList" class="flex items-center gap-2"></div>
    </section>

    <!-- BOTTOM CONTROL BAR -->
    <footer id="bottomControls" class="bg-slate-900 border-t border-slate-800/80 p-3 shrink-0 z-20 hidden">
      
      <!-- MODE A: CROP CONTROLS -->
      <div id="cropControls" class="space-y-2">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 flex-1">
            <button id="btnAutoDetect" class="flex-1 py-2 bg-slate-800 active:bg-slate-700 text-[11px] font-medium rounded-lg flex items-center justify-center gap-1 border border-slate-700">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-brand-400"></i>
              <span>Snap AI</span>
            </button>
            <button id="btnFullArea" class="px-3 py-2 bg-slate-800 active:bg-slate-700 text-[11px] font-medium rounded-lg flex items-center justify-center gap-1 border border-slate-700">
              <i data-lucide="maximize" class="w-3.5 h-3.5 text-slate-400"></i>
            </button>
            <button id="btnToggleDpad" class="px-3 py-2 bg-slate-800 active:bg-slate-700 text-[11px] font-medium rounded-lg flex items-center justify-center gap-1 border border-slate-700">
              <i data-lucide="move" class="w-3.5 h-3.5 text-amber-400"></i>
            </button>
            <button onclick="deleteCurrentPage()" class="px-3 py-2 bg-rose-500/10 active:bg-rose-500/20 text-[11px] font-medium rounded-lg flex items-center justify-center text-rose-400 border border-rose-500/20">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <button id="btnApplyWarp" class="py-2 px-4 bg-brand-600 active:bg-brand-500 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-1 shadow-md shadow-brand-600/30">
            <span>Luruskan</span>
            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- COLLAPSIBLE MICRO D-PAD (POPUP/DRAWER) -->
        <div id="dpadPanel" class="p-2.5 bg-slate-950 rounded-xl border border-slate-800 hidden flex items-center justify-between">
          <div class="text-[11px]">
            <span class="text-slate-400 block">Fine-Tuning:</span>
            <span id="activeCornerLabel" class="text-brand-400 font-semibold text-[10px]">Pojok Kiri Atas</span>
          </div>

          <div class="grid grid-cols-3 gap-1 w-28">
            <div></div>
            <button onclick="nudgeActiveCorner(0, -2)" class="p-1.5 bg-slate-800 active:bg-brand-600 rounded flex items-center justify-center text-slate-300">
              <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
            </button>
            <div></div>
            
            <button onclick="nudgeActiveCorner(-2, 0)" class="p-1.5 bg-slate-800 active:bg-brand-600 rounded flex items-center justify-center text-slate-300">
              <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="toggleCornerSelection()" class="p-1.5 bg-brand-600/20 text-brand-400 rounded flex items-center justify-center text-[10px] font-mono font-bold">
              GANTI
            </button>
            <button onclick="nudgeActiveCorner(2, 0)" class="p-1.5 bg-slate-800 active:bg-brand-600 rounded flex items-center justify-center text-slate-300">
              <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            </button>

            <div></div>
            <button onclick="nudgeActiveCorner(0, 2)" class="p-1.5 bg-slate-800 active:bg-brand-600 rounded flex items-center justify-center text-slate-300">
              <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            </button>
            <div></div>
          </div>
        </div>
      </div>

      <!-- MODE B: FILTER & RESULT CONTROLS -->
      <div id="filterControls" class="space-y-2.5 hidden">
        <!-- Horizontal Scroll Filters -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
          <button onclick="applyFilterToCurrent('magic')" class="filter-btn shrink-0 px-3 py-1.5 bg-slate-800 active:bg-slate-700 border border-brand-500 rounded-lg text-xs flex items-center gap-1.5" data-filter="magic">
            <i data-lucide="wand-2" class="w-3.5 h-3.5 text-brand-400"></i>
            <span>Magic Color</span>
          </button>
          <button onclick="applyFilterToCurrent('bw')" class="filter-btn shrink-0 px-3 py-1.5 bg-slate-800 active:bg-slate-700 border border-slate-700 rounded-lg text-xs flex items-center gap-1.5" data-filter="bw">
            <i data-lucide="contrast" class="w-3.5 h-3.5 text-slate-300"></i>
            <span>B&W Doc</span>
          </button>
          <button onclick="applyFilterToCurrent('gray')" class="filter-btn shrink-0 px-3 py-1.5 bg-slate-800 active:bg-slate-700 border border-slate-700 rounded-lg text-xs flex items-center gap-1.5" data-filter="gray">
            <i data-lucide="sun-medium" class="w-3.5 h-3.5 text-slate-300"></i>
            <span>Grayscale</span>
          </button>
          <button onclick="applyFilterToCurrent('original')" class="filter-btn shrink-0 px-3 py-1.5 bg-slate-800 active:bg-slate-700 border border-slate-700 rounded-lg text-xs flex items-center gap-1.5" data-filter="original">
            <i data-lucide="image" class="w-3.5 h-3.5 text-slate-300"></i>
            <span>Asli</span>
          </button>
        </div>

        <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-800">
          <div class="flex items-center gap-1">
            <button id="btnBackToCrop" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-700 rounded-lg text-[11px] text-brand-400 border border-slate-700 flex items-center gap-1">
              <i data-lucide="crop" class="w-3.5 h-3.5"></i> Edit Sudut
            </button>
            <button onclick="rotateCurrent(90)" class="px-2.5 py-1.5 bg-slate-800 active:bg-slate-700 rounded-lg text-[11px] text-slate-300 border border-slate-700 flex items-center gap-1">
              <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i> Putar
            </button>
          </div>

          <button onclick="applyFilterToAll()" class="px-3 py-1.5 bg-slate-800 active:bg-slate-700 rounded-lg text-[11px] text-slate-300 border border-slate-700">
            Terapkan Semua
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script>
    lucide.createIcons();

    // DOM Elements
    const dropZone = document.getElementById('dropZone');
    const imageUpload = document.getElementById('imageUpload');
    const thumbSection = document.getElementById('thumbSection');
    const thumbList = document.getElementById('thumbList');
    const cropStage = document.getElementById('cropStage');
    const previewStage = document.getElementById('previewStage');
    const bottomControls = document.getElementById('bottomControls');
    const cropControls = document.getElementById('cropControls');
    const filterControls = document.getElementById('filterControls');
    const dpadPanel = document.getElementById('dpadPanel');
    const btnToggleDpad = document.getElementById('btnToggleDpad');
    const magnifier = document.getElementById('magnifier');
    const pageBadge = document.getElementById('pageBadge');
    const activeCornerLabel = document.getElementById('activeCornerLabel');

    const btnAutoDetect = document.getElementById('btnAutoDetect');
    const btnFullArea = document.getElementById('btnFullArea');
    const btnApplyWarp = document.getElementById('btnApplyWarp');
    const btnBackToCrop = document.getElementById('btnBackToCrop');
    const btnExportPDF = document.getElementById('btnExportPDF');

    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');
    const resultCanvas = document.getElementById('resultCanvas');
    const resultCtx = resultCanvas.getContext('2d');

    // App State
    let pages = [];
    let currentPageIndex = 0;
    let activePointIndex = -1;
    const cornerNames = ["Kiri Atas", "Kanan Atas", "Kanan Bawah", "Kiri Bawah"];

    // 1. FILE UPLOAD HANDLER
    imageUpload.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(Array.from(e.target.files));
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); });
    });
    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files));
    });

    function handleFiles(files) {
      const validFiles = files.filter(f => f.type.startsWith('image/'));
      if (!validFiles.length) return;

      let loaded = 0;
      validFiles.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const pageObj = {
              id: Date.now() + Math.random(),
              rawImage: img,
              corners: [],
              selectedCornerIndex: 0,
              filter: 'magic',
              rotation: 0,
              isWarped: false,
              warpedCanvas: document.createElement('canvas')
            };

            // Jalankan deteksi garis presisi
            detectDocumentCornersUltra(pageObj);

            pages.push(pageObj);
            loaded++;

            if (loaded === validFiles.length) {
              dropZone.classList.add('hidden');
              thumbSection.classList.remove('hidden');
              bottomControls.classList.remove('hidden');
              btnExportPDF.disabled = false;
              
              selectPage(pages.length - validFiles.length);
              renderThumbnails();
              updatePageBadge();
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      imageUpload.value = '';
    }

    function updatePageBadge() {
      pageBadge.innerText = `${currentPageIndex + 1}/${pages.length} Hal`;
    }

    // 2. LINE-INTERSECTION DETECTION
    function detectDocumentCornersUltra(pageObj) {
      const img = pageObj.rawImage;
      const W = img.width;
      const H = img.height;

      const sw = 220;
      const sh = Math.round((H / W) * 220);
      const scaleX = W / sw;
      const scaleY = H / sh;

      const tCanvas = document.createElement('canvas');
      tCanvas.width = sw;
      tCanvas.height = sh;
      const tCtx = tCanvas.getContext('2d');
      tCtx.drawImage(img, 0, 0, sw, sh);

      const imgData = tCtx.getImageData(0, 0, sw, sh);
      const data = imgData.data;

      const gray = new Uint8Array(sw * sh);
      const hist = new Int32Array(256);

      for (let i = 0; i < data.length; i += 4) {
        const lum = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
        gray[i / 4] = lum;
        hist[lum]++;
      }

      let total = sw * sh;
      let sum = 0;
      for (let i = 0; i < 256; i++) sum += i * hist[i];

      let sumB = 0, wB = 0, wF = 0, varMax = 0, threshold = 120;
      for (let t = 0; t < 256; t++) {
        wB += hist[t];
        if (wB === 0) continue;
        wF = total - wB;
        if (wF === 0) break;
        sumB += t * hist[t];
        let mB = sumB / wB;
        let mF = (sum - sumB) / wF;
        let varBetween = wB * wF * (mB - mF) * (mB - mF);
        if (varBetween > varMax) {
          varMax = varBetween;
          threshold = t;
        }
      }
      threshold = Math.max(100, threshold);

      const mask = new Uint8Array(sw * sh);
      let count = 0;
      for (let y = 1; y < sh - 1; y++) {
        for (let x = 1; x < sw - 1; x++) {
          const idx = y * sw + x;
          if (gray[idx] >= threshold) {
            mask[idx] = 1;
            count++;
          }
        }
      }

      if (count < (sw * sh) * 0.1) {
        pageObj.corners = [
          { x: W * 0.06, y: H * 0.06 },
          { x: W * 0.94, y: H * 0.06 },
          { x: W * 0.94, y: H * 0.94 },
          { x: W * 0.06, y: H * 0.94 }
        ];
        return;
      }

      const topPts = [], botPts = [], leftPts = [], rightPts = [];
      for (let x = 8; x < sw - 8; x += 2) {
        for (let y = 4; y < sh - 4; y++) {
          if (mask[y * sw + x] === 1) { topPts.push({ x, y }); break; }
        }
        for (let y = sh - 5; y >= 4; y--) {
          if (mask[y * sw + x] === 1) { botPts.push({ x, y }); break; }
        }
      }
      for (let y = 8; y < sh - 8; y += 2) {
        for (let x = 4; x < sw - 4; x++) {
          if (mask[y * sw + x] === 1) { leftPts.push({ x, y }); break; }
        }
        for (let x = sw - 5; x >= 4; x--) {
          if (mask[y * sw + x] === 1) { rightPts.push({ x, y }); break; }
        }
      }

      const lineTop = fitLineY(topPts);
      const lineBot = fitLineY(botPts);
      const lineLeft = fitLineX(leftPts);
      const lineRight = fitLineX(rightPts);

      const ptTL = intersect(lineTop, lineLeft);
      const ptTR = intersect(lineTop, lineRight);
      const ptBR = intersect(lineBot, lineRight);
      const ptBL = intersect(lineBot, lineLeft);

      pageObj.corners = [
        { x: Math.max(0, Math.min(W, ptTL.x * scaleX)), y: Math.max(0, Math.min(H, ptTL.y * scaleY)) },
        { x: Math.max(0, Math.min(W, ptTR.x * scaleX)), y: Math.max(0, Math.min(H, ptTR.y * scaleY)) },
        { x: Math.max(0, Math.min(W, ptBR.x * scaleX)), y: Math.max(0, Math.min(H, ptBR.y * scaleY)) },
        { x: Math.max(0, Math.min(W, ptBL.x * scaleX)), y: Math.max(0, Math.min(H, ptBL.y * scaleY)) }
      ];
    }

    function fitLineY(pts) {
      if (pts.length < 2) return { m: 0, c: 0 };
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, n = pts.length;
      for (let p of pts) { sumX += p.x; sumY += p.y; sumXY += p.x * p.y; sumX2 += p.x * p.x; }
      const m = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX || 1);
      const c = (sumY - m * sumX) / n;
      return { m, c };
    }

    function fitLineX(pts) {
      if (pts.length < 2) return { m: 0, c: 0 };
      let sumX = 0, sumY = 0, sumXY = 0, sumY2 = 0, n = pts.length;
      for (let p of pts) { sumX += p.x; sumY += p.y; sumXY += p.x * p.y; sumY2 += p.y * p.y; }
      const m = (n * sumXY - sumX * sumY) / (n * sumY2 - sumY * sumY || 1);
      const c = (sumX - m * sumY) / n;
      return { m, c };
    }

    function intersect(lineH, lineV) {
      const y = (lineH.m * lineV.c + lineH.c) / (1 - lineH.m * lineV.m || 1);
      const x = lineV.m * y + lineV.c;
      return { x, y };
    }

    // 3. PAGE SELECTION
    function selectPage(idx) {
      if (idx < 0 || idx >= pages.length) return;
      currentPageIndex = idx;
      const curPage = pages[currentPageIndex];

      activeCornerLabel.innerText = cornerNames[curPage.selectedCornerIndex];
      updatePageBadge();

      if (curPage.isWarped) {
        cropStage.classList.add('hidden');
        previewStage.classList.remove('hidden');
        cropControls.classList.add('hidden');
        filterControls.classList.remove('hidden');
        renderFinalPageResult(curPage);
      } else {
        cropStage.classList.remove('hidden');
        previewStage.classList.add('hidden');
        cropControls.classList.remove('hidden');
        filterControls.classList.add('hidden');

        cropCanvas.width = curPage.rawImage.width;
        cropCanvas.height = curPage.rawImage.height;
        renderCropOverlay();
        attachCanvasEvents();
      }

      renderThumbnails();
    }

    function renderThumbnails() {
      thumbList.innerHTML = '';
      pages.forEach((p, i) => {
        const isActive = (i === currentPageIndex);
        const card = document.createElement('div');
        card.className = `cursor-pointer p-1 rounded-lg border transition flex items-center gap-1.5 shrink-0 ${
          isActive ? 'border-brand-500 bg-brand-500/10' : 'border-slate-800 bg-slate-950'
        }`;
        card.onclick = () => selectPage(i);

        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 40;
        thumbCanvas.height = 48;
        thumbCanvas.className = "w-7 h-9 object-contain rounded bg-slate-900";
        const tCtx = thumbCanvas.getContext('2d');
        
        if (p.isWarped && p.warpedCanvas.width) {
          tCtx.drawImage(p.warpedCanvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
        } else {
          tCtx.drawImage(p.rawImage, 0, 0, thumbCanvas.width, thumbCanvas.height);
        }

        const label = document.createElement('span');
        label.className = `text-[10px] pr-1.5 ${isActive ? 'text-brand-400 font-bold' : 'text-slate-400'}`;
        label.innerText = `Hal ${i + 1}`;

        card.appendChild(thumbCanvas);
        card.appendChild(label);
        thumbList.appendChild(card);
      });
      lucide.createIcons();
    }

    function deleteCurrentPage() {
      if (!pages.length) return;
      pages.splice(currentPageIndex, 1);
      if (pages.length === 0) {
        dropZone.classList.remove('hidden');
        thumbSection.classList.add('hidden');
        bottomControls.classList.add('hidden');
        cropStage.classList.add('hidden');
        previewStage.classList.add('hidden');
        btnExportPDF.disabled = true;
      } else {
        currentPageIndex = Math.max(0, currentPageIndex - 1);
        selectPage(currentPageIndex);
      }
      updatePageBadge();
    }

    // 4. OVERLAY & TOUCH HANDLER
    function renderCropOverlay() {
      const curPage = pages[currentPageIndex];
      if (!curPage) return;

      cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      cropCtx.drawImage(curPage.rawImage, 0, 0);

      cropCtx.fillStyle = "rgba(15, 23, 42, 0.6)";
      cropCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);

      cropCtx.save();
      cropCtx.beginPath();
      cropCtx.moveTo(curPage.corners[0].x, curPage.corners[0].y);
      for (let i = 1; i < 4; i++) cropCtx.lineTo(curPage.corners[i].x, curPage.corners[i].y);
      cropCtx.closePath();
      cropCtx.clip();
      cropCtx.drawImage(curPage.rawImage, 0, 0);
      cropCtx.restore();

      cropCtx.strokeStyle = "#10b981";
      cropCtx.lineWidth = Math.max(3, cropCanvas.width * 0.004);
      cropCtx.beginPath();
      cropCtx.moveTo(curPage.corners[0].x, curPage.corners[0].y);
      for (let i = 1; i < 4; i++) cropCtx.lineTo(curPage.corners[i].x, curPage.corners[i].y);
      cropCtx.closePath();
      cropCtx.stroke();

      const radius = Math.max(14, cropCanvas.width * 0.02);
      curPage.corners.forEach((p, idx) => {
        const isSelected = (idx === curPage.selectedCornerIndex);
        cropCtx.beginPath();
        cropCtx.arc(p.x, p.y, isSelected ? radius * 1.3 : radius, 0, 2 * Math.PI);
        cropCtx.fillStyle = isSelected ? "#34d399" : "#ffffff";
        cropCtx.fill();
        cropCtx.lineWidth = 3.5;
        cropCtx.strokeStyle = isSelected ? "#ffffff" : "#059669";
        cropCtx.stroke();

        cropCtx.beginPath();
        cropCtx.arc(p.x, p.y, radius * 0.35, 0, 2 * Math.PI);
        cropCtx.fillStyle = isSelected ? "#064e3b" : "#10b981";
        cropCtx.fill();
      });
    }

    btnToggleDpad.addEventListener('click', () => {
      dpadPanel.classList.toggle('hidden');
    });

    function toggleCornerSelection() {
      const curPage = pages[currentPageIndex];
      curPage.selectedCornerIndex = (curPage.selectedCornerIndex + 1) % 4;
      activeCornerLabel.innerText = cornerNames[curPage.selectedCornerIndex];
      renderCropOverlay();
    }

    window.nudgeActiveCorner = function(dx, dy) {
      const curPage = pages[currentPageIndex];
      if (!curPage) return;
      const idx = curPage.selectedCornerIndex;
      curPage.corners[idx].x = Math.max(0, Math.min(cropCanvas.width, curPage.corners[idx].x + dx));
      curPage.corners[idx].y = Math.max(0, Math.min(cropCanvas.height, curPage.corners[idx].y + dy));
      renderCropOverlay();
    };

    btnAutoDetect.addEventListener('click', () => {
      detectDocumentCornersUltra(pages[currentPageIndex]);
      renderCropOverlay();
    });

    btnFullArea.addEventListener('click', () => {
      const curPage = pages[currentPageIndex];
      curPage.corners = [
        { x: 0, y: 0 },
        { x: cropCanvas.width, y: 0 },
        { x: cropCanvas.width, y: cropCanvas.height },
        { x: 0, y: cropCanvas.height }
      ];
      renderCropOverlay();
    });

    function attachCanvasEvents() {
      const getCoords = (e) => {
        const rect = cropCanvas.getBoundingClientRect();
        const scaleX = cropCanvas.width / rect.width;
        const scaleY = cropCanvas.height / rect.height;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY, clientX: cx, clientY: cy };
      };

      const start = (e) => {
        const pos = getCoords(e);
        const curPage = pages[currentPageIndex];
        const hitDist = Math.max(45, cropCanvas.width * 0.06);
        activePointIndex = curPage.corners.findIndex(p => Math.hypot(p.x - pos.x, p.y - pos.y) < hitDist);
        if (activePointIndex !== -1) {
          curPage.selectedCornerIndex = activePointIndex;
          activeCornerLabel.innerText = cornerNames[activePointIndex];
          updateLoupe(pos);
        }
      };

      const move = (e) => {
        if (activePointIndex === -1) return;
        e.preventDefault();
        const pos = getCoords(e);
        const curPage = pages[currentPageIndex];
        curPage.corners[activePointIndex].x = Math.min(Math.max(0, pos.x), cropCanvas.width);
        curPage.corners[activePointIndex].y = Math.min(Math.max(0, pos.y), cropCanvas.height);
        renderCropOverlay();
        updateLoupe(pos);
      };

      const end = () => {
        activePointIndex = -1;
        magnifier.style.display = 'none';
      };

      function updateLoupe(pos) {
        const curPage = pages[currentPageIndex];
        magnifier.style.display = 'block';
        magnifier.style.left = `${Math.min(window.innerWidth - 130, Math.max(10, pos.clientX - 60))}px`;
        magnifier.style.top = `${Math.max(10, pos.clientY - 140)}px`;

        const zoom = 2.5;
        magnifier.style.backgroundImage = `url(${curPage.rawImage.src})`;
        magnifier.style.backgroundSize = `${cropCanvas.width * (cropCanvas.clientWidth / cropCanvas.width) * zoom}px auto`;
        
        const activeCorner = curPage.corners[curPage.selectedCornerIndex];
        const screenX = (activeCorner.x / cropCanvas.width) * cropCanvas.clientWidth;
        const screenY = (activeCorner.y / cropCanvas.height) * cropCanvas.clientHeight;
        magnifier.style.backgroundPosition = `-${screenX * zoom - 60}px -${screenY * zoom - 60}px`;
      }

      cropCanvas.onmousedown = start;
      window.onmousemove = move;
      window.onmouseup = end;

      cropCanvas.ontouchstart = start;
      window.ontouchmove = move;
      window.ontouchend = end;
    }

    // 5. WARPING & FILTERS
    btnApplyWarp.addEventListener('click', () => {
      warpPage(pages[currentPageIndex]);
      selectPage(currentPageIndex);
    });

    btnBackToCrop.addEventListener('click', () => {
      pages[currentPageIndex].isWarped = false;
      selectPage(currentPageIndex);
    });

    function warpPage(pageObj) {
      const pts = pageObj.corners;
      const widthTop = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const widthBottom = Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y);
      const heightLeft = Math.hypot(pts[3].x - pts[0].x, pts[3].y - pts[0].y);
      const heightRight = Math.hypot(pts[2].x - pts[1].x, pts[2].y - pts[1].y);

      const dstW = Math.round(Math.max(widthTop, widthBottom));
      const dstH = Math.round(Math.max(heightLeft, heightRight));

      pageObj.warpedCanvas.width = dstW;
      pageObj.warpedCanvas.height = dstH;
      const ctx = pageObj.warpedCanvas.getContext('2d');

      const sCanvas = document.createElement('canvas');
      sCanvas.width = pageObj.rawImage.width;
      sCanvas.height = pageObj.rawImage.height;
      const sCtx = sCanvas.getContext('2d');
      sCtx.drawImage(pageObj.rawImage, 0, 0);

      const srcData = sCtx.getImageData(0, 0, sCanvas.width, sCanvas.height).data;
      const outImgData = ctx.createImageData(dstW, dstH);
      const dstData = outImgData.data;

      const p0 = pts[0], p1 = pts[1], p2 = pts[2], p3 = pts[3];
      const srcW = sCanvas.width, srcH = sCanvas.height;

      for (let y = 0; y < dstH; y++) {
        const v = y / dstH;
        for (let x = 0; x < dstW; x++) {
          const u = x / dstW;
          const sx = (1 - u) * (1 - v) * p0.x + u * (1 - v) * p1.x + u * v * p2.x + (1 - u) * v * p3.x;
          const sy = (1 - u) * (1 - v) * p0.y + u * (1 - v) * p1.y + u * v * p2.y + (1 - u) * v * p3.y;

          const isx = Math.floor(sx);
          const isy = Math.floor(sy);

          if (isx >= 0 && isx < srcW && isy >= 0 && isy < srcH) {
            const srcIdx = (isy * srcW + isx) * 4;
            const dstIdx = (y * dstW + x) * 4;
            dstData[dstIdx]     = srcData[srcIdx];
            dstData[dstIdx + 1] = srcData[srcIdx + 1];
            dstData[dstIdx + 2] = srcData[srcIdx + 2];
            dstData[dstIdx + 3] = 255;
          }
        }
      }
      ctx.putImageData(outImgData, 0, 0);
      pageObj.isWarped = true;
    }

    function renderFinalPageResult(pageObj) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        if (b.dataset.filter === pageObj.filter) {
          b.classList.add('border-brand-500');
          b.classList.remove('border-slate-700');
        } else {
          b.classList.remove('border-brand-500');
          b.classList.add('border-slate-700');
        }
      });

      resultCanvas.width = pageObj.warpedCanvas.width;
      resultCanvas.height = pageObj.warpedCanvas.height;
      resultCtx.drawImage(pageObj.warpedCanvas, 0, 0);

      const imgData = resultCtx.getImageData(0, 0, resultCanvas.width, resultCanvas.height);
      const data = imgData.data;
      const len = data.length;

      if (pageObj.filter === 'magic') {
        for (let i = 0; i < len; i += 4) {
          let r = data[i], g = data[i + 1], b = data[i + 2];
          r = ((r - 128) * 1.45) + 155;
          g = ((g - 128) * 1.45) + 155;
          b = ((b - 128) * 1.45) + 155;
          data[i]     = Math.min(255, Math.max(0, r));
          data[i + 1] = Math.min(255, Math.max(0, g));
          data[i + 2] = Math.min(255, Math.max(0, b));
        }
      } else if (pageObj.filter === 'bw') {
        for (let i = 0; i < len; i += 4) {
          const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          data[i] = data[i + 1] = data[i + 2] = avg > 130 ? 255 : (avg < 75 ? 0 : (avg - 75) * 4.6);
        }
      } else if (pageObj.filter === 'gray') {
        for (let i = 0; i < len; i += 4) {
          const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          data[i] = data[i + 1] = data[i + 2] = gray;
        }
      }
      resultCtx.putImageData(imgData, 0, 0);
    }

    window.applyFilterToCurrent = function(type) {
      pages[currentPageIndex].filter = type;
      renderFinalPageResult(pages[currentPageIndex]);
    };

    window.applyFilterToAll = function() {
      const type = pages[currentPageIndex].filter;
      pages.forEach(p => { p.filter = type; });
      renderFinalPageResult(pages[currentPageIndex]);
    };

    window.rotateCurrent = function(deg) {
      const curPage = pages[currentPageIndex];
      const temp = document.createElement('canvas');
      temp.width = curPage.warpedCanvas.width;
      temp.height = curPage.warpedCanvas.height;
      temp.getContext('2d').drawImage(curPage.warpedCanvas, 0, 0);

      curPage.warpedCanvas.width = temp.height;
      curPage.warpedCanvas.height = temp.width;

      const ctx = curPage.warpedCanvas.getContext('2d');
      ctx.save();
      ctx.translate(curPage.warpedCanvas.width / 2, curPage.warpedCanvas.height / 2);
      ctx.rotate((deg * Math.PI) / 180);
      ctx.drawImage(temp, -temp.width / 2, -temp.height / 2);
      ctx.restore();

      renderFinalPageResult(curPage);
      renderThumbnails();
    };

    // 6. PDF EXPORT
    btnExportPDF.addEventListener('click', () => {
      if (!pages.length) return;
      const { jsPDF } = window.jspdf;
      let pdf = null;

      pages.forEach((page, index) => {
        if (!page.isWarped) warpPage(page);

        const bufferCanvas = document.createElement('canvas');
        bufferCanvas.width = page.warpedCanvas.width;
        bufferCanvas.height = page.warpedCanvas.height;
        const bCtx = bufferCanvas.getContext('2d');
        bCtx.drawImage(page.warpedCanvas, 0, 0);

        const imgData = bCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
        const data = imgData.data;
        const len = data.length;

        if (page.filter === 'magic') {
          for (let i = 0; i < len; i += 4) {
            data[i]     = Math.min(255, Math.max(0, ((data[i] - 128) * 1.45) + 155));
            data[i + 1] = Math.min(255, Math.max(0, ((data[i + 1] - 128) * 1.45) + 155));
            data[i + 2] = Math.min(255, Math.max(0, ((data[i + 2] - 128) * 1.45) + 155));
          }
        } else if (page.filter === 'bw') {
          for (let i = 0; i < len; i += 4) {
            const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            data[i] = data[i + 1] = data[i + 2] = avg > 130 ? 255 : (avg < 75 ? 0 : (avg - 75) * 4.6);
          }
        } else if (page.filter === 'gray') {
          for (let i = 0; i < len; i += 4) {
            const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            data[i] = data[i + 1] = data[i + 2] = gray;
          }
        }
        bCtx.putImageData(imgData, 0, 0);

        const isLandscape = bufferCanvas.width > bufferCanvas.height;
        const orientation = isLandscape ? 'l' : 'p';

        if (index === 0) {
          pdf = new jsPDF({ orientation, unit: 'px', format: [bufferCanvas.width, bufferCanvas.height] });
        } else {
          pdf.addPage([bufferCanvas.width, bufferCanvas.height], orientation);
        }

        pdf.addImage(bufferCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, bufferCanvas.width, bufferCanvas.height);
      });

      pdf.save(`DocuScan_${pages.length}_Hal_${Date.now()}.pdf`);
    });
  </script>
</body>
</html>
